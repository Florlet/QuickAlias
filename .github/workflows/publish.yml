name: Build and Publish

on:
  release:
    types: [ published ]

jobs:
  # =========================================================
  # Job 1: Prepare Environment and Build Core
  # =========================================================
  prepare_and_build:
    name: 🛠️ Build
    runs-on: ubuntu-latest
    outputs:
      release_status: ${{ contains(github.ref_name, 'Alpha') && 'alpha' || contains(github.ref_name, 'Beta') && 'beta' || 'release' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📝 Read Java Version
        id: java_ver
        run: |
          if [ -f gradle.properties ]; then
            JAVA_VERSION=$(grep "java_version" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi

          if [ -z "$JAVA_VERSION" ]; then
            JAVA_VERSION=21
            echo "java_version not found in gradle.properties, defaulting to $JAVA_VERSION"
          else
            echo "Found java_version=$JAVA_VERSION in gradle.properties"
          fi

          echo "version=$JAVA_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: ☕ Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.java_ver.outputs.version }}

      - name: 🔧 Grant Gradle Execution Permissions
        run: chmod +x ./gradlew

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🏗️ Execute Gradle Build
        run: ./gradlew build

      - name: 📤 Stage Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-artifacts
          path: |
            fabric/build/libs/QuickAlias-Fabric-*.jar
            forge/build/libs/QuickAlias-Forge-*.jar
            neoforge/build/libs/QuickAlias-NeoForge-*.jar
            !**/*-javadoc.jar
            !**/*-sources.jar
          if-no-files-found: ignore
          retention-days: 1

  # =========================================================
  # Job 2: GitHub Release Handling
  # =========================================================
  github-release:
    name: 📦 Update GitHub Release
    needs: prepare_and_build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-artifacts
          path: artifacts

      - name: ☁️ Upload Jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Update Release Status
        if: needs.prepare_and_build.outputs.release_status == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = context.payload.release.id;

            console.log(`Updating release ${release_id} to non-prerelease status.`);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              prerelease: false,
              make_latest: "true"
            });

  # =========================================================
  # Job 3: Publish to Mod Sites
  # =========================================================
  mod-publish:
    name: 🚀 Publish to Mod Sites
    needs: prepare_and_build
    runs-on: ubuntu-latest

    env:
      MODRINTH_PROJECT_ID: jGHTlhbU
      CURSEFORGE_PROJECT_ID: 1391158

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-artifacts
          path: artifacts

      - name: 🔍 Check Artifact Existence
        id: check_files
        run: |
          # check Fabric
          if ls artifacts/fabric/build/libs/QuickAlias-Fabric-*.jar 1> /dev/null 2>&1; then
            echo "Fabric artifact found."
            echo "fabric_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fabric artifact NOT found."
            echo "fabric_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # check Forge
          if ls artifacts/forge/build/libs/QuickAlias-Forge-*.jar 1> /dev/null 2>&1; then
            echo "Forge artifact found."
            echo "forge_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Forge artifact NOT found."
            echo "forge_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # check NeoForge
          if ls artifacts/neoforge/build/libs/QuickAlias-NeoForge-*.jar 1> /dev/null 2>&1; then
            echo "NeoForge artifact found."
            echo "neoforge_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "NeoForge artifact NOT found."
            echo "neoforge_exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # --- Fabric Branch ---
      - name: 🚀 Publish Fabric & Quilt Version
        if: steps.check_files.outputs.fabric_exists == 'true'
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: "[Fabric] ${{ github.event.release.name }}"
          version: "${{ github.event.release.tag_name }}-fabric"
          version-type: ${{ needs.prepare_and_build.outputs.release_status }}
          changelog: ${{ github.event.release.body }}

          loaders: |
            fabric
            quilt
          game-versions: |
            ${{ github.event.release.target_commitish }}

          files: artifacts/fabric/build/libs/QuickAlias-Fabric-*.jar

      # --- Forge Branch ---
      - name: 🚀 Publish Forge Version
        if: steps.check_files.outputs.forge_exists == 'true'
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: "[Forge] ${{ github.event.release.name }}"
          version: "${{ github.event.release.tag_name }}-forge"
          version-type: ${{ needs.prepare_and_build.outputs.release_status }}
          changelog: ${{ github.event.release.body }}

          loaders: |
            forge
          game-versions: |
            ${{ github.event.release.target_commitish }}

          files: artifacts/forge/build/libs/QuickAlias-Forge-*.jar

      # --- NeoForge Branch ---
      - name: 🚀 Publish NeoForge Version
        if: steps.check_files.outputs.neoforge_exists == 'true'
        uses: kir-antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: "[NeoForge] ${{ github.event.release.name }}"
          version: "${{ github.event.release.tag_name }}-neoforge"
          version-type: ${{ needs.prepare_and_build.outputs.release_status }}
          changelog: ${{ github.event.release.body }}

          loaders: |
            neoforge
          game-versions: |
            ${{ github.event.release.target_commitish }}

          files: artifacts/neoforge/build/libs/QuickAlias-NeoForge-*.jar
